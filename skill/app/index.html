<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflows</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect x='64' y='64' width='896' height='896' rx='200' fill='%233b5bdb'/%3E%3Cpath d='M300 330h200M300 512h300M300 694h160' stroke='%23fff' stroke-width='56' stroke-linecap='round' fill='none'/%3E%3Cpath d='M640 600l170 94-170 94z' fill='%2351cf66'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --line: #e2e5ea; --text: #1d2330; --muted: #6b7385;
  --accent: #3b5bdb; --accent-ink: #ffffff; --ok: #2b8a3e; --bad: #c92a2a; --warn: #e67700; --run: #1971c2;
  --code-bg: #f3f4f7; --sel: #edf2ff;
  --c-find: #1971c2; --c-debug: #e8590c; --c-test: #7048e8; --c-build: #0c8599; --c-run: #2b8a3e;
  --c-git: #c2255c; --c-edit: #a07400; --c-note: #868e96; --c-other: #868e96;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --panel: #181b22; --panel-2: #1f232c; --line: #2b303b; --text: #e3e6ec; --muted: #8b93a5;
    --accent: #5c7cfa; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --run: #4dabf7;
    --code-bg: #12151b; --sel: #1e2540;
    --c-find: #4dabf7; --c-debug: #ff922b; --c-test: #9775fa; --c-build: #3bc9db; --c-run: #51cf66;
    --c-git: #f06595; --c-edit: #fcc419; --c-note: #868e96; --c-other: #868e96;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; width: 100%; }

header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 14px; margin: 0 6px 0 0; letter-spacing: .2px; }
header .search { flex: 1; max-width: 520px; }
header .search input { width: 100%; }
header .agentbtn { margin-left: auto; }
header .store { color: var(--muted); font-size: 11px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
.title .meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.layout { flex: 1; display: flex; min-height: 0; }
aside { width: 290px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 0; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.list { overflow: auto; flex: 1; }
.item { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--panel-2); }
.item.on { background: var(--sel); }
.item .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.item .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { flex: 1; overflow: auto; min-width: 0; display: flex; flex-direction: column; }
.content { padding: 14px 18px 90px; flex: 1; }
.title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.title h2 { font-size: 17px; margin: 0; }
.sub { color: var(--muted); margin-bottom: 12px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.chip { border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.chip.on { background: var(--sel); border-color: var(--accent); }

.pill { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; line-height: 16px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.task { margin: 18px 0 6px; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.note { color: var(--muted); font-style: italic; margin: 4px 0 4px 34px; }
.step { display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line); align-items: start; }
.step.sel { background: var(--sel); }
.step .n { color: var(--muted); text-align: right; padding-top: 1px; }
.step .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.step .desc { font-weight: 600; }
.step .meta { color: var(--muted); font-size: 11px; }
.step pre { margin: 6px 0 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: hidden; position: relative; cursor: pointer; }
.step pre.open { max-height: none; cursor: auto; }
.step .err { color: var(--bad); font-size: 12px; margin-top: 4px; }
.step .acts { display: flex; gap: 4px; }
.step .acts button { padding: 2px 8px; font-size: 12px; }
.st { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.st.ok { color: var(--ok); } .st.failed { color: var(--bad); } .st.running { color: var(--run); } .st.skipped, .st.idle { color: var(--muted); }

.bar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 -4px 12px rgba(0,0,0,.06); }
.bar input[type=text] { min-width: 180px; }

.console { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); margin-top: 14px; }
.console .ch { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.console pre { margin: 0; padding: 10px; max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.console .mark { color: var(--accent); font-weight: 600; }
.envbox { display: none; margin: 8px 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.envbox.open { display: block; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.agentbtn { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot.live { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.ctabs { display: flex; gap: 2px; }
.ctabs button { border: 0; background: none; padding: 2px 8px; color: var(--muted); border-radius: 4px; }
.ctabs button.on { background: var(--sel); color: var(--text); }
.feed { padding: 8px 10px; max-height: 460px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.fe { border-left: 3px solid var(--line); padding: 3px 8px; }
.fe .fh { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.fe .ft { color: var(--muted); font-size: 11px; margin-left: auto; }
.fe.ok { border-color: var(--ok); } .fe.bad { border-color: var(--bad); } .fe.agent { border-color: var(--accent); }
.fe.tool { border-color: var(--c-build); } .fe.ask { border-color: var(--warn); background: var(--panel); }
.fe .say { white-space: pre-wrap; word-break: break-word; }
.fe .say.thought { color: var(--muted); font-style: italic; }
.fe pre, .rpc pre { margin: 4px 0 0; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.asks { position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.askcard { border: 1px solid var(--warn); background: var(--panel); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.askcard .q { flex: 1; min-width: 200px; }
.askcard .q .mono { color: var(--muted); display: block; max-height: 4.5em; overflow: hidden; word-break: break-all; }
.rpc { padding: 6px 10px; max-height: 460px; overflow: auto; }
.rpc .r { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; padding: 2px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.rpc .r .dir { font-weight: 700; } .rpc .r .dir.out { color: var(--accent); } .rpc .r .dir.in { color: var(--ok); }
.rpc .r .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; margin-top: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.card .ch { display: flex; gap: 8px; align-items: center; }
.card .ch b { font-size: 14px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 2px 8px; font-size: 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
.fixbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; margin: 6px 0 10px; }
.st.fixing { color: var(--warn); } .st.fixed { color: var(--ok); }
.logline.rpcline { color: var(--muted); }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 420px; }
.toast.show { opacity: .95; }
@media (max-width: 760px) {
  .layout { flex-direction: column; }
  aside { width: 100%; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header .store { display: none; }
  .content { padding: 12px 16px 90px; }
}
</style>
</head>
<body>
<header>
  <h1>Workflows</h1>
  <select id="project" title="Project"></select>
  <div class="search"><input id="q" type="search" placeholder="Search steps in this project (command or description)…"></div>
  <button class="agentbtn" id="agentsBtn" title="Local coding agents (ACP)"><span class="dot" style="background:var(--muted)"></span><span>Agents</span></button>
  <span class="store mono" id="store" title="__WF_ROOT__"></span>
</header>
<div class="layout">
  <aside>
    <div class="tabs">
      <button data-tab="sessions">Sessions</button>
      <button data-tab="workflows">Workflows</button>
      <button data-tab="runs">Runs</button>
      <button data-tab="fixes">Fixes</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"><div class="content"><div class="empty">Loading…</div></div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN = "__WF_TOKEN__";
const HOMEDIR = "__WF_HOMEDIR__";
// display only: copy buttons and runs always use the real text
const tilde = (s) => (s || "").split(HOMEDIR + "/").join("~/");
const CATS = ["find", "debug", "test", "build", "run", "git", "edit", "note", "other"];
const S = { project: null, tab: "sessions", view: null, sel: new Map(), cats: new Set(), hideFailed: false, run: null, poll: null,
  agents: [], fix: { agent: "off", auto: false } };
try { Object.assign(S.fix, JSON.parse(localStorage.getItem("wf.fix") || "{}")); } catch (e) {}
const saveFix = () => { try { localStorage.setItem("wf.fix", JSON.stringify(S.fix)); } catch (e) {} };

// ---------- helpers
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const $ = (s) => document.querySelector(s);
async function get(path, params = {}) {
  const r = await fetch(path + "?" + new URLSearchParams(params));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-WF-Token": TOKEN }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); }
const fail = (e) => toast("Error: " + e.message);
const catPill = (c) => h("span", { class: "pill", style: `color:var(--c-${CATS.includes(c) ? c : "other"})` }, c);
const fmtTime = (ts) => new Date(ts * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
function statusDot(s) { const c = s === "ok" ? "var(--ok)" : s === "FAILED" ? "var(--bad)" : "var(--warn)"; return h("span", { class: "dot", title: s, style: `background:${c}` }); }
function copy(text) { navigator.clipboard.writeText(text).then(() => toast("Copied")); }
function setMain(...nodes) { const m = $("#main"); m.replaceChildren(h("div", { class: "content" }, ...nodes)); return m; }
function remember() { try { localStorage.setItem("wf.ui", JSON.stringify({ project: S.project, tab: S.tab })); } catch (e) {} }

// ---------- sidebar
async function loadProjects() {
  const ps = await get("/api/projects");
  const sel = $("#project");
  sel.replaceChildren(...ps.map((p) => h("option", { value: p.name }, `${p.name} (${p.sessions})`)));
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("wf.ui") || "{}"); } catch (e) {}
  S.project = ps.some((p) => p.name === saved.project) ? saved.project : ps[0]?.name;
  S.tab = saved.tab || "sessions";
  if (!S.project) return setMain(h("div", { class: "empty" }, "No recorded projects yet. Sessions appear here after Claude runs a command."));
  sel.value = S.project;
  await renderList();
}
async function renderList() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === S.tab));
  const list = $("#list");
  try {
    if (S.tab === "sessions") {
      const ss = await get("/api/sessions", { project: S.project });
      list.replaceChildren(...ss.map((s) => h("div", { class: "item" + (S.view?.kind === "session" && S.view.n === s.n ? " on" : ""), onclick: () => openSession(s.n) },
        h("div", { class: "t" }, `#${String(s.n).padStart(4, "0")}`, h("span", { class: "s" }, s.branch || "")),
        h("div", { class: "s" }, `${s.started.replace("T", " ")} · ${s.steps} steps${s.failed ? ` · ${s.failed} failed` : ""}`),
        s.tasks.length ? h("div", { class: "s" }, s.tasks.join(" · ")) : null)));
      if (!S.view && ss[0]) openSession(ss[0].n);
    } else if (S.tab === "workflows") {
      const ws = await get("/api/workflows", { project: S.project });
      list.replaceChildren(...(ws.length ? ws.map((w) => h("div", { class: "item" + (S.view?.kind === "workflow" && S.view.name === w.name ? " on" : ""), onclick: () => openWorkflow(w.name) },
        h("div", { class: "t" }, w.name), h("div", { class: "s" }, `${w.steps} steps · ${w.description}`)))
        : [h("div", { class: "item s" }, "No workflows yet — select steps in a session and click Create workflow.")]));
    } else if (S.tab === "fixes") {
      const fs = await get("/api/fixes", { project: S.project });
      list.replaceChildren(...(fs.length ? fs.map((f) => h("div", { class: "item" + (S.view?.kind === "fix" && S.view.fix.id === f.id ? " on" : ""), onclick: () => openFix(f) },
        h("div", { class: "t" }, h("span", { class: "pill", style: "color:var(--accent)" }, f.kind), h("span", { class: "mono" }, f.id),
          h("span", { class: "s", style: "margin-left:auto" }, `${f.wins || 0}✓ ${f.losses || 0}✗`)),
        h("div", { class: "s" }, f.error || "(no error text)"),
        h("div", { class: "s" }, `${f.origin} · ${f.source}`)))
        : [h("div", { class: "item s" }, "No fixes yet. They are learned when a failed command passes after a change, or when wf fix / Run with fix succeeds.")]));
    } else {
      const rs = await get("/api/runs", { project: S.project });
      list.replaceChildren(...(rs.length ? rs.map((r) => h("div", { class: "item" + (S.view?.kind === "log" && S.view.file === r.file ? " on" : ""), onclick: () => openLog(r) },
        h("div", { class: "t" }, r.live ? h("span", { class: "st running" }, "live") : r.rc == null ? null : h("span", { class: "st " + (r.rc === 0 ? "ok" : "failed") }, r.rc === 0 ? "ok" : `exit ${r.rc}`), r.file.replace(/\.log$/, "")),
        h("div", { class: "s" }, fmtTime(r.modified)))) : [h("div", { class: "item s" }, "No runs yet.")]));
    }
  } catch (e) { fail(e); }
}

// ---------- step rows (sessions + search)
function selectionBar() {
  const n = S.sel.size;
  if (!n) return null;
  const name = h("input", { type: "text", placeholder: "workflow-name" });
  const desc = h("input", { type: "text", placeholder: "What it does (optional)", style: "flex:1" });
  const failed = h("input", { type: "checkbox" });
  const create = async () => {
    const bySession = new Map();
    for (const { session, step } of S.sel.values()) (bySession.get(session) || bySession.set(session, []).get(session)).push(step);
    const sources = [...bySession].sort((a, b) => a[0] - b[0]).map(([s, steps]) => `${s}:${steps.sort((a, b) => a - b).join(",")}`);
    try {
      await post("/api/extract", { project: S.project, name: name.value.trim(), description: desc.value.trim(), sources, include_failed: failed.checked, keep_dupes: true });
      S.sel.clear(); S.tab = "workflows"; remember(); await renderList(); openWorkflow(name.value.trim()); toast("Workflow created");
    } catch (e) { fail(e); }
  };
  return h("div", { class: "bar" }, h("b", {}, `${n} step${n > 1 ? "s" : ""} selected`), name, desc,
    h("label", {}, failed, " include failed"), h("button", { class: "primary", onclick: create }, "Create workflow"),
    h("button", { onclick: () => { S.sel.clear(); rerender(); } }, "Clear"));
}
function stepRow(e, session) {
  const key = `${session}:${e.step}`;
  const cb = h("input", { type: "checkbox", checked: S.sel.has(key), onchange: () => { cb.checked ? S.sel.set(key, { session, step: e.step }) : S.sel.delete(key); rerender(); } });
  const pre = h("pre", { onclick: () => pre.classList.add("open") }, tilde(e.command));
  return h("div", { class: "step" + (S.sel.has(key) ? " sel" : "") }, cb, h("div", { class: "n" }, e.step),
    h("div", {},
      h("div", { class: "head" }, statusDot(e.status), catPill(e.category), h("span", { class: "desc" }, tilde(e.description) || "(no description)"),
        h("span", { class: "meta" }, [e.tool && e.tool !== "Bash" ? e.tool : null, session !== S.view?.n ? `#${session}` : null, e.ts?.slice(11)].filter(Boolean).join(" · "))),
      pre, e.error ? h("div", { class: "err" }, "! " + e.error) : null),
    h("div", { class: "acts" }, h("button", { title: "Copy command", onclick: () => copy(e.command) }, "Copy")));
}
function filterBar(events) {
  const counts = {};
  events.filter((e) => e.type === "cmd").forEach((e) => counts[e.category] = (counts[e.category] || 0) + 1);
  return h("div", { class: "toolbar" },
    ...Object.keys(counts).sort().map((c) => h("button", { class: "chip" + (S.cats.has(c) ? " on" : ""), onclick: () => { S.cats.has(c) ? S.cats.delete(c) : S.cats.add(c); rerender(); } }, catPill(c), ` ${counts[c]}`)),
    h("label", { style: "margin-left:8px" }, h("input", { type: "checkbox", checked: S.hideFailed, onchange: (ev) => { S.hideFailed = ev.target.checked; rerender(); } }), " hide failed"),
    h("button", { style: "margin-left:auto", onclick: () => { visible(events).forEach((e) => S.sel.set(`${e.session ?? S.view.n}:${e.step}`, { session: e.session ?? S.view.n, step: e.step })); rerender(); } }, "Select visible"));
}
const visible = (events) => events.filter((e) => e.type === "cmd" && (!S.cats.size || S.cats.has(e.category)) && (!S.hideFailed || e.status === "ok"));

async function openSession(n) {
  stopPoll(); S.view = { kind: "session", n, events: await get("/api/session", { project: S.project, n }).catch((e) => (fail(e), [])) };
  rerender(); renderList();
}
function renderSession() {
  const { n, events } = S.view;
  const cmds = events.filter((e) => e.type === "cmd");
  const rows = [];
  for (const e of events) {
    if (e.type === "mark") rows.push(h("div", { class: "task" }, `Task ${e.task}: ${e.title}`));
    else if (e.type === "note") rows.push(h("div", { class: "note" }, "Note: " + e.text));

  setMain(h("div", { class: "title" }, h("h2", {}, v.file)),
    h("div", { class: "toolbar" }, isFix ? null : h("button", { onclick: () => { S.tab = "workflows"; remember(); renderList(); openWorkflow(name); } }, `Open workflow ${name}`), h("button", { onclick: () => copy(v.text) }, "Copy log"),
      isFix ? h("label", {}, h("input", { type: "checkbox", checked: !!v.hideRpc, onchange: (e) => { v.hideRpc = e.target.checked; rerender(); } }), " hide ACP messages") : null),
    h("div", { class: "console" }, pre));
}

// ---------- agents (ACP)
async function loadAgents() {
  try { const d = await get("/api/agents"); S.agents = d.agents; S.agentConfig = d.config; } catch (e) { return; }
  const btn = $("#agentsBtn"), live = S.agents.find((a) => a.connected), def = S.agents.find((a) => a.default);
  const shown = live || def;
  const color = live ? "var(--ok)" : shown?.probe ? (shown.probe.ok ? "var(--ok)" : "var(--bad)") : "var(--muted)";
  btn.replaceChildren(h("span", { class: "dot" + (live ? " live" : ""), style: `background:${color}` }),
    h("span", {}, shown ? `${shown.name}${live ? " · connected" : ""}` : "No agents"));
  btn.title = live ? `${live.name} is in an ACP session (${live.connected.workflow})` : shown ? `Default agent: ${shown.name} (${shown.transport})` : "No local coding agents found";
  const sig = JSON.stringify(S.agents.map((a) => [a.name, a.available, a.transport, !!a.connected, a.probe?.ok]));
  const changed = sig !== S.agentSig; S.agentSig = sig;
  // re-render only when something shown changed: a workflow page has inputs that a re-render would reset
  if (changed && (S.view?.kind === "agents" || (S.view?.kind === "workflow" && !S.view.editing && !S.run?.running))) rerender();
}
async function openAgents() {
  stopPoll(); S.view = { kind: "agents", probing: new Set() }; rerender();
  // check native ACP agents right away (handshake only: no session, no prompt); npx ones only on request
  for (const a of S.agents) if (a.available && a.transport === "acp" && !a.via_npx && !a.probe) probeAgent(a.name);
}
async function probeAgent(name) {
  const v = S.view; v.probing?.add(name); rerender();
  try { await post("/api/agents/probe", { name }); } catch (e) { fail(e); }
  v.probing?.delete(name); await loadAgents();
}
function renderAgents() {
  const v = S.view;
  const cards = S.agents.map((a) => {
    const p = a.probe, busy = v.probing.has(a.name);
    const how = a.transport === "acp" ? h("span", { class: "pill", style: "color:var(--accent)" }, "ACP") : a.transport === "exec" ? h("span", { class: "pill", style: "color:var(--warn)" }, "exec") : h("span", { class: "pill", style: "color:var(--muted)" }, "not installed");
    const status = a.connected ? h("span", { class: "st ok" }, "● connected") : busy ? h("span", { class: "st running" }, "connecting…") : p ? h("span", { class: "st " + (p.ok ? "ok" : "failed") }, p.ok ? (p.exec ? "installed" : "reachable") : "unreachable") : h("span", { class: "st idle" }, "not tested");
    return h("div", { class: "card" },
      h("div", { class: "ch" }, h("b", {}, a.name), how, a.default ? h("span", { class: "pill" }, "default") : null, h("span", { style: "margin-left:auto" }, status)),
      h("div", { class: "kv" },
        h("span", {}, "command"), h("span", { class: "mono" }, a.argv ? a.argv.join(" ") : (a.acp?.[0] || a.exec || ["-"]).join(" ")),
        a.connected ? [h("span", {}, "session"), h("span", {}, `fixing a step in ${a.connected.workflow}`)] : null,
        p?.ok && !p.exec ? [h("span", {}, "protocol"), h("span", {}, `ACP v${p.protocol} · handshake ${p.ms} ms`)] : null,
        p?.agent_info ? [h("span", {}, "agent"), h("span", {}, `${p.agent_info.name || ""} ${p.agent_info.version || ""}`)] : null,
        p?.capabilities?.length ? [h("span", {}, "capabilities"), h("span", {}, p.capabilities.join(", "))] : null,
        p?.prompt?.length ? [h("span", {}, "prompt input"), h("span", {}, p.prompt.join(", "))] : null,
        p?.auth?.length ? [h("span", {}, "login"), h("span", {}, p.auth.join(" · "))] : null,
        p && !p.ok ? [h("span", {}, "error"), h("span", { class: "err", style: "margin:0" }, p.error)] : null,
        p ? [h("span", {}, "checked"), h("span", {}, new Date(p.t * 1000).toLocaleTimeString())] : null),
      a.via_npx ? h("div", { class: "meta" }, `Runs through npx (${a.npx}); the first check downloads it.`) : null,
      a.transport === "exec" ? h("div", { class: "meta" }, "No ACP: runs one headless prompt per attempt; its edits are read from git.") : null,
      !a.available ? h("div", { class: "meta" }, `Install ${(a.acp?.[0] || a.exec || [a.name])[0]} to use it.`) : null,
      h("div", { class: "toolbar", style: "margin:4px 0 0" },
        h("button", { disabled: !a.available || busy, onclick: () => probeAgent(a.name) }, a.transport === "acp" ? "Test connection" : "Check"),
        h("button", { disabled: !a.available, onclick: () => { S.fix.agent = a.name; saveFix(); toast(`Workflows will be fixed with ${a.name}`); rerender(); } }, S.fix.agent === a.name ? "✓ used for fixing" : "Use for fixing")));
  });
  setMain(h("div", { class: "title" }, h("h2", {}, "Agents")),
    h("div", { class: "sub" }, "Local coding agents that fix failing workflow steps. ACP agents (Agent Client Protocol) stream their messages, tool calls and permission requests here; “Test connection” only does the ACP handshake — no session, no prompt."),
    h("div", { class: "toolbar" }, h("button", { onclick: () => S.agents.filter((a) => a.available).forEach((a) => probeAgent(a.name)) }, "Test all"), h("span", { class: "meta mono" }, `add or override agents in ${tilde(S.agentConfig || "")}`)),
    h("div", { class: "cards" }, ...cards));
}

// ---------- fixes
function openFix(f) { stopPoll(); S.view = { kind: "fix", fix: f }; rerender(); renderList(); }
function renderFix() {
  const f = S.view.fix;
  const body = f.kind === "steps" ? h("pre", { class: "mono" }, f.steps.map((s) => `# ${s.description || ""}\n${s.cwd ? `cd ${s.cwd}\n` : ""}${s.command}`).map(tilde).join("\n\n"))
    : f.kind === "command" ? h("pre", { class: "mono" }, tilde(f.retry)) : f.kind === "patch" ? h("pre", { class: "mono" }, tilde(f.patch)) : null;
  setMain(h("div", { class: "title" }, h("h2", {}, `Fix ${f.id}`), h("span", { class: "pill", style: "color:var(--accent)" }, f.kind), h("span", { class: "meta" }, `worked ${f.wins || 0} of ${(f.wins || 0) + (f.losses || 0)}`)),
    h("div", { class: "sub" }, `${f.origin} · ${f.source} · learned ${f.ts?.replace("T", " ")}${f.last_used ? ` · last used ${f.last_used.replace("T", " ")}` : ""}`),
    h("div", { class: "kv", style: "grid-template-columns:110px 1fr;font-size:13px" },
      h("span", {}, "error"), h("span", { class: "mono err", style: "margin:0" }, f.error || "-"),
      h("span", {}, "failing command"), h("span", { class: "mono" }, tilde(f.command)),
      h("span", {}, "directory"), h("span", { class: "mono" }, tilde(f.cwd || "-"))),
    f.summary ? h("div", { style: "margin-top:12px" }, h("b", {}, "Agent's summary"), h("div", { class: "say", style: "white-space:pre-wrap" }, f.summary)) : null,
    body ? h("div", { style: "margin-top:12px" }, h("b", {}, { steps: "Steps that fixed it", command: "Working command", patch: "Change" }[f.kind]), h("div", { class: "console" }, body)) : null,
    h("div", { class: "toolbar", style: "margin-top:12px" },
      body ? h("button", { onclick: () => copy(f.kind === "patch" ? f.patch : f.kind === "command" ? f.retry : f.steps.map((s) => s.command).join("\n")) }, "Copy") : null,
      h("button", { class: "danger", onclick: async () => { try { await post("/api/fixes/forget", { project: S.project, id: f.id }); toast("Forgotten"); S.view = null; renderList(); setMain(h("div", { class: "empty" }, "Fix forgotten.")); } catch (e) { fail(e); } } }, "Forget this fix")));
}

function rerender() {
  if (!S.view) return;
  ({ session: renderSession, search: renderSearch, workflow: renderWorkflow, log: renderLog, agents: renderAgents, fix: renderFix })[S.view.kind]();
}

// ---------- wiring
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; remember(); renderList(); }));
$("#project").addEventListener("change", (e) => { S.project = e.target.value; S.view = null; S.sel.clear(); S.cats.clear(); remember(); renderList(); });
let qT; $("#q").addEventListener("input", (e) => { clearTimeout(qT); qT = setTimeout(() => runSearch(e.target.value.trim()), 250); });
$("#store").replaceChildren(h("bdi", { dir: "ltr" }, tilde("__WF_ROOT__")));
$("#agentsBtn").addEventListener("click", openAgents);
loadProjects().catch(fail);
loadAgents(); setInterval(loadAgents, 4000);
</script>
</body>
</html>
